<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cloud Eleven ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fce4f3 0%, #e8d5f5 30%, #d5e8f5 70%, #d5f5e8 100%);
      overflow: hidden;
    }
 
    /* soft blobs */
    body::before {
      content: '';
      position: fixed;
      top: -80px; left: -80px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(144, 201, 248, 0.5) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: blobFloat 8s ease-in-out infinite;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -60px; right: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(238, 113, 213, 0.409) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: blobFloat 10s ease-in-out infinite reverse;
    }
 
    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, 20px); }
    }
 
    /* glass card */
    .card {
      width: 340px;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 32px;
      padding: 2.2rem 2rem;
      text-align: center;
      box-shadow: 0 8px 48px rgba(180,150,210,0.18), 0 2px 8px rgba(180,150,210,0.10);
      position: relative;
      z-index: 1;
    }
 
    .day-name {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(236, 83, 213, 0.65);
      margin-bottom: 4px;
    }
 
    .date-number {
      font-size: 76px;
      font-weight: 300;
      line-height: 1;
      color: rgba(90,55,135,0.88);
      letter-spacing: -3px;
      margin: 4px 0 2px;
    }
 
    .month-year {
      font-size: 15px;
      font-weight: 400;
      color: rgba(130,95,165,0.6);
      letter-spacing: 0.08em;
      margin-bottom: 1.6rem;
    }
 
    .divider {
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180,140,215,0.4), transparent);
      margin: 0 auto 1.6rem;
    }
 
    .clock {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: -1.5px;
      color: rgba(80,50,125,0.92);
      font-variant-numeric: tabular-nums;
    }
 
    .clock-secs {
      font-size: 22px;
      color: rgba(150,115,185,0.5);
    }
 
    .period {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: rgba(155,120,185,0.55);
      margin: 4px 0 1.6rem;
      text-transform: uppercase;
    }
 
    /* sparkle dots */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.6rem;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(190,160,225,0.35);
      transition: all 0.4s ease;
    }
    .dot.active {
      background: rgba(155,110,200,0.8);
      transform: scale(1.5);
    }
 
    /* mini calendar */
    .mini-cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(180,150,215,0.15);
    }
    .ch {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(165,130,195,0.45);
      text-align: center;
      padding-bottom: 5px;
    }
    .cd {
      font-size: 11px;
      color: rgba(115,80,150,0.5);
      text-align: center;
      padding: 3px 0;
      border-radius: 50%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .cd.today {
      background: rgba(160,120,205,0.18);
      color: rgba(85,50,130,0.95);
      font-weight: 500;
    }
    .cd.empty { visibility: hidden; }
 
    /* angel toast */
    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.88);
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 28px;
      padding: 2rem 2.4rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 999;
      box-shadow: 0 16px 64px rgba(160,120,205,0.22);
      min-width: 230px;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .toast-star {
      font-size: 20px;
      display: block;
      margin-bottom: 8px;
      animation: twinkle 1.6s ease-in-out infinite;
    }
    .toast-time {
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 2px;
      color: rgba(95,65,140,0.9);
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }
    .toast-quote {
      font-size: 14px;
      font-weight: 400;
      color: rgba(135,100,168,0.75);
      line-height: 1.55;
    }
 
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.55; transform: scale(0.82) rotate(15deg); }
    }
  </style>
</head>
<body>
 
  <div class="card">
    <div class="day-name"  id="dayName"></div>
    <div class="date-number" id="dateNum"></div>
    <div class="month-year"  id="monthYear"></div>
    <div class="divider"></div>
    <div class="clock">
      <span id="clockHM"></span><span class="clock-secs" id="clockS"></span>
    </div>
    <div class="period" id="period"></div>
    <div class="dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
    </div>
    <div class="mini-cal" id="miniCal"></div>
  </div>
 
  <div class="toast" id="toast">
    <span class="toast-star">✦</span>
    <div class="toast-time"  id="toastTime"></div>
    <div class="toast-quote" id="toastQuote"></div>
  </div>
 
  <script>
    const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_S = ['Su','Mo','Tu','We','Th','Fr','Sa'];
 
    const ANGEL = {
      '1:11':  'you are exactly where you need to be',
      '2:22':  'everything is aligning ✦',
      '3:33':  'you are so deeply loved',
      '4:44':  'you are protected',
      '5:55':  'magic is already on its way',
      '10:10': 'the universe is listening',
      '11:11': 'make a wish ✨',
      '12:12': 'a new chapter is beginning',
    };
 
    function pad(n) { return String(n).padStart(2,'0'); }
 
    let lastAngelMinute = -1;
    let toastTimer = null;
 
    function tick() {
      const now  = new Date();
      const h    = now.getHours();
      const m    = now.getMinutes();
      const s    = now.getSeconds();
      const h12  = h % 12 || 12;
      const ampm = h < 12 ? 'AM' : 'PM';
 
      document.getElementById('dayName').textContent  = DAYS[now.getDay()];
      document.getElementById('dateNum').textContent  = now.getDate();
      document.getElementById('monthYear').textContent = MONTHS[now.getMonth()] + ' ' + now.getFullYear();
      document.getElementById('clockHM').textContent  = h12 + ':' + pad(m);
      document.getElementById('clockS').textContent   = ':' + pad(s);
      document.getElementById('period').textContent   = ampm;
 
      // pulse dots
      const active = s % 3;
      [0,1,2].forEach(i => document.getElementById('d'+i).classList.toggle('active', i === active));
 
      // angel timing
      const key = ANGEL[h12 + ':' + pad(m)] ? h12 + ':' + pad(m)
                : ANGEL[h  + ':' + pad(m)] ? h  + ':' + pad(m)
                : null;
      const minute = h * 60 + m;
      if (key && minute !== lastAngelMinute) {
        lastAngelMinute = minute;
        showToast(key, ANGEL[key]);
      }
    }
 
    function showToast(time, quote) {
      document.getElementById('toastTime').textContent  = time;
      document.getElementById('toastQuote').textContent = quote;
      const t = document.getElementById('toast');
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 5500);
    }
 
    function buildCal() {
      const now   = new Date();
      const year  = now.getFullYear();
      const month = now.getMonth();
      const today = now.getDate();
      const first = new Date(year, month, 1).getDay();
      const days  = new Date(year, month + 1, 0).getDate();
      const cal   = document.getElementById('miniCal');
      cal.innerHTML = '';
 
      DAYS_S.forEach(d => {
        const el = document.createElement('div');
        el.className = 'ch';
        el.textContent = d;
        cal.appendChild(el);
      });
      for (let i = 0; i < first; i++) {
        const el = document.createElement('div');
        el.className = 'cd empty';
        el.textContent = '.';
        cal.appendChild(el);
      }
      for (let d = 1; d <= days; d++) {
        const el = document.createElement('div');
        el.className = 'cd' + (d === today ? ' today' : '');
        el.textContent = d;
        cal.appendChild(el);
      }
    }
 
    buildCal();
    tick();
    setInterval(tick, 1000);
 
    // demo angel popup after 1.5s
    setTimeout(() => showToast('11:11', 'make a wish ✨'), 1500);
  </script>
</body>
</html>
